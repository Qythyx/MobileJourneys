name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # SixLabors.ImageSharp v4 enforces a build-time license. MSBuild reads this
    # environment variable as the $(SixLaborsLicenseKey) property, so it applies to
    # both the build and test steps. Set the SIXLABORS_LICENSE_KEY repository secret.
    env:
      SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # MinVer needs full history + tags to derive the version

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --results-directory TestResults \
            --coverage \
            --coverage-output-format cobertura

      - name: Generate coverage report
        run: |
          dotnet reportgenerator \
            "-reports:TestResults/**/*.cobertura.xml" \
            "-targetdir:coverage" \
            "-reporttypes:HtmlInline;Cobertura;MarkdownSummaryGithub"

      - name: Publish coverage summary to job page
        if: always()
        run: cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          retention-days: 14

  # Auto-tags a new SemVer release from Conventional Commit messages on every
  # push to main, so MinVer stamps the next build with no manual `git tag`.
  release:
    name: Tag release
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # push tags and create GitHub Releases
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # tag action needs full history to read commits since last tag

      # Reads Conventional Commits since the last tag (feat -> minor, fix/perf ->
      # patch, ! / BREAKING CHANGE -> major). default_bump: false means docs/chore/
      # ci/refactor-only ranges cut no release. Plain SemVer tags (no "v" prefix)
      # match the existing tags and MinVer's default expectation.
      - name: Compute and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          tag_prefix: ""
          default_bump: false

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
